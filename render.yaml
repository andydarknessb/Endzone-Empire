services:
  - type: keyvalue
    name: endzone-empire-cache
    plan: starter
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

  - type: web
    name: endzone-empire-api
    runtime: node
    plan: starter
    region: virginia
    numInstances: 1
    buildCommand: npm ci --omit=dev --prefix server
    preDeployCommand: npm --prefix server run migrate
    startCommand: node server/server.js
    healthCheckPath: /api/health/readyz
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: off
    domains:
      - api.endzoneempire.gg
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: SERVICE_NAME
        value: endzone-empire-api
      - key: RUN_JOBS_IN_WEB
        value: "false"
      - key: APP_ORIGIN
        value: https://endzoneempire.gg
      - key: CLIENT_ORIGINS
        value: https://endzoneempire.gg,https://www.endzoneempire.gg
      - key: DATABASE_URL_RUNTIME
        sync: false
      - key: DATABASE_URL_MIGRATIONS
        sync: false
      # preDeployCommand above runs `knex migrate:latest` through
      # server/knexfile.js, which refuses a non-loopback database unless this
      # is exactly "1" (see server/modules/knexTarget.js, #258). The remote
      # host IS the point here: this is the one place in the project where a
      # migration is meant to reach production, so the opt-in is declared
      # here, beside the credentials it authorises, and nowhere else. It is
      # set only on this web service; the worker has no preDeployCommand and
      # never migrates.
      - key: KNEX_ALLOW_REMOTE
        value: "1"
      - key: DB_SSL_CA
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: endzone-empire-cache
          property: connectionString
      - key: SMTP_URL
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: PGPOOL_MAX
        value: "10"
      - key: PGPOOL_IDLE_TIMEOUT_MS
        value: "30000"
      - key: PGPOOL_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: PG_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: RAPID_API_KEY
        sync: false
      - key: RAPID_API_HOST
        value: tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com
      # Tank01 allows ~1,000 requests per MONTH. Both services spend from that
      # one allowance (web: news + admin syncs, worker: live engine +
      # scheduler), so they must agree — usage itself is counted in
      # private.api_usage, shared via Postgres. See modules/tank01Client.js.
      - key: TANK01_MONTHLY_BUDGET
        value: "950"
      - key: TANK01_SOFT_PCT
        value: "80"
      - key: TANK01_HARD_CEILING
        value: "1000"
      # Day of month the RapidAPI billing cycle resets (1-28).
      - key: TANK01_BILLING_ANCHOR_DAY
        value: "1"
      # One /getNFLNews response serves the dashboard widget for this long,
      # cached in Redis so every web instance shares it. The last good payload
      # is also kept without expiry and served stale rather than erroring.
      - key: NEWS_CACHE_TTL_MS
        value: "21600000"
      - key: SPORTSDB_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # The live clock and stat-sync cadence vars live on the worker below —
      # that's where the jobs run (RUN_JOBS_IN_WEB=false). Code defaults apply
      # here, so flipping RUN_JOBS_IN_WEB still behaves identically.

  - type: worker
    name: endzone-empire-worker
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm ci --omit=dev --prefix server
    startCommand: node server/worker.js
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: SERVICE_NAME
        value: endzone-empire-worker
      - key: APP_ORIGIN
        value: https://endzoneempire.gg
      - key: CLIENT_ORIGINS
        value: https://endzoneempire.gg,https://www.endzoneempire.gg
      - key: DATABASE_URL_RUNTIME
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: endzone-empire-cache
          property: connectionString
      - key: SMTP_URL
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: PGPOOL_MAX
        value: "5"
      - key: PG_STATEMENT_TIMEOUT_MS
        value: "30000"
      - key: RAPID_API_KEY
        sync: false
      - key: RAPID_API_HOST
        value: tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com
      # Tank01 allows ~1,000 requests per MONTH. Both services spend from that
      # one allowance (web: news + admin syncs, worker: live engine +
      # scheduler), so they must agree — usage itself is counted in
      # private.api_usage, shared via Postgres. See modules/tank01Client.js.
      - key: TANK01_MONTHLY_BUDGET
        value: "950"
      - key: TANK01_SOFT_PCT
        value: "80"
      - key: TANK01_HARD_CEILING
        value: "1000"
      # Day of month the RapidAPI billing cycle resets (1-28).
      - key: TANK01_BILLING_ANCHOR_DAY
        value: "1"
      # Live NFL clock. ESPN's free scoreboard is the default source (zero
      # quota at ~30s); Tank01 is the automatic fallback after 3 consecutive
      # ESPN failures, at LIVE_FAST_POLL_MS. Between games the loop only does a
      # DB check every LIVE_IDLE_CHECK_MS and spends nothing.
      - key: LIVE_CLOCK_SOURCE
        value: espn
      - key: ESPN_POLL_MS
        value: "30000"
      - key: LIVE_FAST_POLL_MS
        value: "600000"
      - key: LIVE_IDLE_CHECK_MS
        value: "60000"
      # Scheduler ticks (5 min each) between Tank01 box-score syncs in a live
      # window; doubles itself while quota is degraded. 6 = every ~30 min.
      - key: SYNC_EVERY_TICKS
        value: "6"
      - key: SPORTSDB_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
