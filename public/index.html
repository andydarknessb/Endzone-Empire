    <title>Endzone Empire · Fantasy Football &amp; NFL Pick'em Leagues</title>
    <!--
      Site-wide metadata for every URL this shell serves, the hash-routed app
      included (#351). The public BrowserRouter tree replaces these per route
      through react-helmet-async, which only manages head tags carrying data-rh;
      that marker is what keeps a public page from carrying two descriptions.
      The description must equal DEFAULT_DESCRIPTION and the title must equal
      SHELL_TITLE in src/components/public/PublicSeo.jsx; shellMeta.test.jsx
      holds them equal.
    -->
    <meta name="description" data-rh="true" content="Run a fantasy football league, or an NFL pick'em league · no draft, no rosters. Free rankings, player profiles, strategy guides, and NFL game recaps.">
    <meta property="og:type" data-rh="true" content="website">
    <meta property="og:site_name" data-rh="true" content="Endzone Empire">
    <meta property="og:title" data-rh="true" content="Endzone Empire · Fantasy Football &amp; NFL Pick'em Leagues">
    <meta property="og:description" data-rh="true" content="Run a fantasy football league, or an NFL pick'em league · no draft, no rosters. Free rankings, player profiles, strategy guides, and NFL game recaps.">
    <meta property="og:url" data-rh="true" content="https://endzoneempire.gg/">
    <meta property="og:image" data-rh="true" content="https://endzoneempire.gg/og-brand-gradient.png">
    <meta property="og:image:width" data-rh="true" content="1200">
    <meta property="og:image:height" data-rh="true" content="630">
    <meta property="og:image:alt" data-rh="true" content="Endzone Empire fantasy football and NFL pick'em">
    <meta name="twitter:card" data-rh="true" content="summary_large_image">
    <meta name="twitter:title" data-rh="true" content="Endzone Empire · Fantasy Football &amp; NFL Pick'em Leagues">
    <meta name="twitter:description" data-rh="true" content="Run a fantasy football league, or an NFL pick'em league · no draft, no rosters. Free rankings, player profiles, strategy guides, and NFL game recaps.">
    <meta name="twitter:image" data-rh="true" content="https://endzoneempire.gg/og-brand-gradient.png">
    <meta name="twitter:image:alt" data-rh="true" content="Endzone Empire fantasy football and NFL pick'em">
  </head>
