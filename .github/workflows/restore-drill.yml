name: Restore drill

# Monthly restore drill (#3004), run by scripts/ci/restore-drill.sh. Runs on the
# 1st of each month at 09:23 UTC, on demand, and on any PR that changes this file
# or the script. It dumps production's app schemas (public, private) with pg_dump,
# restores the dump into a throwaway PostgreSQL 17 cluster on the runner, checks
# the copy against the source (table count, knex_migrations rows, and at least one
# row in each of users, leagues, teams, players and player_stats), then runs
# integration's pending migrations on top of the copy.
#
# A green run proves a logical dump of production restores into a clean database,
# and that integration's migrations apply to a copy of production's schema and data.
# It does NOT prove that the app role can run those migrations: they run on the copy
# as the runner's superuser. It does not prove Supabase's own backups or point-in-time
# recovery (this job never touches them), and it does not cover Supabase objects
# outside public and private. Supabase-specific objects in production have not been
# exercised by this job yet, so watch the first real run.
#
# Before the secret is added, restrict the monitoring environment to deployments from
# main only. The repository is public, and an unrestricted environment hands its
# secrets to any branch's workflow.
#
# The secret MONITORING_DATABASE_URL (monitoring environment, read only by the drill
# job) must be Supabase's SESSION pooler URL: the pooler host on port 5432. The direct
# host is IPv6 only, and the transaction pooler on 6543 cannot run pg_dump. Its role
# must be the app role's own login, or a role with BYPASSRLS, USAGE on public and
# private, and SELECT on every table and sequence in both: pg_dump runs with row
# security off and fails on any table whose policies would filter it. Percent-encode
# the password inside the URL.
#
# Do not release or deploy while the drill runs. pg_dump takes an ACCESS SHARE lock on
# every table for the length of the dump, and a migration's ALTER would queue behind it.
#
# The runner holds a full copy of production (about 1 GB) for the length of the drill
# job. Nothing is uploaded, and the dump file is deleted on exit.
#
# A red run means one named check failed: the target refusal, pg_dump, pg_restore, a
# count comparison, or npm run migrate. One cause to know: production has recorded a
# migration that integration does not have (a hotfix on main), which knex reports as a
# corrupt migration directory. The log says which step failed and the two values it
# compared. A missing secret is a warning and a green skip, not a failure.

on:
  schedule:
    - cron: '23 9 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/restore-drill.yml'
      - 'scripts/ci/restore-drill.sh'

permissions:
  contents: read

concurrency:
  group: restore-drill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    # The PR run: the same drill against a migrated local source, so a broken
    # script or workflow fails on the PR and not on the first monthly run.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: endzone_empire_test
      PGUSER: endzone
      PGPASSWORD: endzone_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Copied from ci.yml's migration-smoke job; see the comments there.
      - name: Install and start PostgreSQL 17
        run: |
          set -euo pipefail
          cd /
          pg_lsclusters -h | while read -r v n _; do sudo pg_dropcluster --stop "$v" "$n"; done
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -q -y postgresql-17
          sudo pg_createcluster 17 main --port 5432 --start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v u="$PGUSER" -v pw="$PGPASSWORD" -v db="$PGDATABASE" <<'SQL'
          CREATE ROLE :"u" SUPERUSER LOGIN PASSWORD :'pw';
          CREATE DATABASE :"db" OWNER :"u";
          SQL
          pg_lsclusters
          psql -c 'select version()'
      # The runner's pg_dump wrapper picks its newest client (18); a dump from a newer client is not guaranteed to load into this 17 server.
      - name: Put the PostgreSQL 17 client first on PATH
        run: |
          set -euo pipefail
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
      - name: Create the source database and migrate it
        run: |
          set -euo pipefail
          echo "creating drill_source and running npm run migrate against it"
          psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE drill_source'
          PGDATABASE=drill_source npm run migrate
          # Steps drill_source back one migration so the drill exercises the pending path: the copy restores with 1 pending, applies it, ends at 0.
          PGDATABASE=drill_source npx knex migrate:down
      - name: Run the restore drill against the local source
        env:
          SOURCE_DATABASE_URL: postgres://endzone:endzone_test@127.0.0.1:5432/drill_source
          DRILL_ALLOW_EMPTY: '1'
        run: |
          set -euo pipefail
          bash scripts/ci/restore-drill.sh

  drill:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: monitoring
    timeout-minutes: 45
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: endzone_empire_test
      PGUSER: endzone
      PGPASSWORD: endzone_test
      NODE_ENV: test
    steps:
      - name: Check the monitoring secret
        id: secret
        env:
          SOURCE_DATABASE_URL: ${{ secrets.MONITORING_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_DATABASE_URL" ]; then
            echo "::warning::MONITORING_DATABASE_URL is not set in the monitoring environment, so the restore drill is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Refuse before masking or printing: a raw @ / ? or # makes libpq split the URL elsewhere, so the mask would not cover all of the password.
          rest="${SOURCE_DATABASE_URL#*:}"
          rest="${rest#*:}"
          pw="${rest%@*}"
          case "$pw" in
            *[@/?]* | *"#"*)
              echo "::error::MONITORING_DATABASE_URL: percent-encode the password"
              exit 1
              ;;
          esac
          # Mask the password text: libpq can echo part of a malformed URL, and GitHub masks only the whole secret.
          echo "::add-mask::$pw"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Checkout integration
        if: steps.secret.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: integration
          persist-credentials: false
      # Copied from ci.yml's migration-smoke job; see the comments there.
      - name: Install and start PostgreSQL 17
        if: steps.secret.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cd /
          pg_lsclusters -h | while read -r v n _; do sudo pg_dropcluster --stop "$v" "$n"; done
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -q -y postgresql-17
          sudo pg_createcluster 17 main --port 5432 --start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v u="$PGUSER" -v pw="$PGPASSWORD" -v db="$PGDATABASE" <<'SQL'
          CREATE ROLE :"u" SUPERUSER LOGIN PASSWORD :'pw';
          CREATE DATABASE :"db" OWNER :"u";
          SQL
          pg_lsclusters
          psql -c 'select version()'
      # The runner's pg_dump wrapper picks its newest client (18); a dump from a newer client is not guaranteed to load into this 17 server.
      - name: Put the PostgreSQL 17 client first on PATH
        if: steps.secret.outputs.ready == 'true'
        run: |
          set -euo pipefail
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secret.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: steps.secret.outputs.ready == 'true'
        run: |
          set -euo pipefail
          npm ci
      - name: Run the restore drill against production
        if: steps.secret.outputs.ready == 'true'
        env:
          SOURCE_DATABASE_URL: ${{ secrets.MONITORING_DATABASE_URL }}
        run: |
          set -euo pipefail
          bash scripts/ci/restore-drill.sh
