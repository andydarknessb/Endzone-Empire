name: Semgrep CE

on:
  push:
    branches: [main, integration]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    # Installed from PyPI rather than run as the semgrep/semgrep container:
    # anonymous Docker Hub pulls are rate-limited on shared runners and the
    # scan failed without running (toomanyrequests). Same pinned version.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx run --spec semgrep==1.153.0 semgrep scan --config auto --error --strict
