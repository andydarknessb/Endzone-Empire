name: Scheduled browser suite

# Weekly browser suite that lives outside the PR browser job (spec #2998): the page-by-page checks that took most of
# browser-security's 25 minutes. Its first spec is the Lineup layout-shift guard (tests/scheduled/lineup-cls.spec.ts).
# The phone and desktop shift scores must stay within their budgets, and a control block must push the phone score
# over its budget, which proves the observer still sees shifts.
#
# Runs Mondays at 11:07 UTC, on manual dispatch, and on any PR that changes this file, playwright.scheduled.config.js
# or tests/scheduled/. The scheduled run checks out integration. A red run means a page's layout moved past its budget
# (the failure message lists the shift entries) or the observer stopped seeing shifts. It is not a production outage.

on:
  schedule:
    - cron: '7 11 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/scheduled-browser.yml'
      - 'playwright.scheduled.config.js'
      - 'tests/scheduled/**'

permissions:
  contents: read

concurrency:
  group: scheduled-browser
  cancel-in-progress: false

jobs:
  scheduled-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && 'integration' || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: |
          set -euo pipefail
          npm ci
      # No --with-deps: its apt-get step has stalled for hours on this runner's mirror (see ci.yml's browser-security job).
      - run: |
          set -euo pipefail
          npx playwright install chromium
        timeout-minutes: 10
      - run: |
          set -euo pipefail
          npm run test:scheduled
        env:
          CI: "true"
