name: CI

on:
  push:
    branches: [main, integration]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:colors
      # #307: two branches can each take the next free docs/adr/ number off
      # the same base at the same time; the file paths differ, so git never
      # conflicts and both PRs go green. This runs the guard's own test file
      # (scripts/ci/check-adr-uniqueness.test.js) plus the guard itself
      # (scripts/ci/check-adr-uniqueness.js), which fails on a duplicate
      # numeric prefix or a gap in the sequence.
      - run: npm run check:adr-uniqueness
      # The uniqueness guard above only lists docs/adr/ (readdirSync); it never
      # opens an ADR, so it cannot see a merged ADR being rewritten in place,
      # which is the more damaging path. This guard compares every ADR that
      # exists on the base ref against the checkout: append-only, with the
      # Status: line free to change (superseded in place). Base is the PR's
      # target sha on pull requests and the previous tip on pushes, so a
      # rewrite merged on stale checks is caught by the push build. The guard
      # fails on a missing base rather than passing on nothing.
      - run: npm run check:adr-immutability
        env:
          ADR_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      # close-merged-issues.yml closes the issues a merged PR names (#330).
      # Its parser tests run here so a broken parser cannot merge; the
      # post-merge job re-runs them as a tripwire before it writes anything.
      - run: npm run test:close-merged-issues
      # The dependency-audit jobs below call scripts/ci/audit-with-retry.js
      # (#838), which retries only an npm advisories-endpoint outage and never
      # a real advisory. Its test drives the script with a fake npm executable
      # so it exercises every branch without touching the network; running it
      # here gates the wrapper the same way the parser test above gates its
      # script (a broken wrapper cannot merge).
      - run: npm run test:audit-with-retry
      # The Promote workflow's Render deploy poller (#733) decides the
      # production release's red/green: fail fast on a failed build, wait
      # through a slow one, and never fire the worker hook while the old web
      # instance still answers 200. Its tests run here so a regression in the
      # poller cannot merge, in the same job as the close-merged-issues test.
      - run: npm run test:wait-for-render-deploy
      # The Promote workflow's first step (#2552) refuses a commit whose CI
      # run did not conclude success. Its tests run here so a regression in
      # that gate cannot merge.
      - run: npm run test:check-ci-passed
      # The #1928 editorial-vs-engine scorer and the weekly dump script have
      # node:test suites that the root Jest config (src/ only) never collects.
      # Running them here means a broken scorer or dump cannot merge (#2385).
      - run: npm run test:editorial-calls
      # The holdout-confirm-2026 study captures against these constants; an
      # unintended change (even a key-order change) silently drops captured
      # weeks. Deliberate changes update the pin in the same commit.
      - run: node scripts/ci/check-model-constants.js
      # @testing-library/dom must resolve to exactly one installed copy. A
      # second copy re-splits user-event's act()-aware config, so every
      # user-event interaction in the client suite dispatches outside act()
      # silently, with no test failing (#219). This guard (#224) fails fast and
      # names the cause here instead of letting it surface downstream as an
      # unrelated user-event test days later (#313). Runs after npm ci (it needs
      # the installed tree) and before the client suite below. `check:dom-dedupe`
      # runs the guard's own unit test and then the guard.
      - run: npm run check:dom-dedupe
      - run: npm test -- --runInBand
        env:
          CI: "true"
      # Guard the content-based cross-tree server-test discovery (#234) that
      # `npm run test:server` relies on, before running it. A step, not a job.
      # It fails if discovery regresses - e.g. if it silently stops finding a
      # jest test under src/ that exercises server code - which is exactly the
      # gap #234 closes: a discovery step that runs zero (or too few) files
      # while looking authoritative is worse than the hard-coded list it
      # replaces. The sibling testMatch guard (test:jest-discovery, #171) is
      # already run in CI by the `guards` job via `npm run guards`, so it is not
      # repeated here.
      - run: npm run test:cross-tree-discovery
      - run: npm run test:server
        env:
          # The Gate-3 publication (backtest-data/publish/) is committed as of
          # this workflow, so the clean-clone reconstruction test's
          # skip-if-absent mode is no longer the right default here - flip it
          # to a hard failure so a future accidental omission of the
          # publication tree cannot pass CI silently.
          BACKTEST_PUBLICATION_REQUIRED: "1"
      - run: npm run build
        env:
          CI: "true"
          GENERATE_SOURCEMAP: "false"
      - run: npm run check:bundle
      - run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build-and-sbom
          path: |
            build
            sbom.cdx.json
          retention-days: 14

  guards:
    # #247: three config guards (test:eslint-scoping, test:check-dom-dedupe,
    # test:jest-discovery) existed only as npm scripts nobody's CI ran. CRA
    # pins `jest.testMatch` to `src/` (see scripts/jestTestMatch.test.js), and
    # these guards are `node:test` files anyway, so the client suite in the
    # test-build job above never reaches them. This job runs all three
    # through a single aggregating `guards` npm script instead of inlining
    # each guard's command, so a script renamed out from under this job
    # fails on "Missing script" (a red job) rather than silently no-op'ing.
    # This job also runs the repository's unified lint pass (npm run lint,
    # scripts/lint.js from #284) as its own step, so a lint failure is
    # attributable in the job log rather than folded into the guards chain.
    # That is the eslint gate #284's header anticipated as "#247's CI step":
    # it lints src, server and scripts at warning level (MAX_WARNINGS=0, so a
    # single warning is a red job); #659 adds this step. test:eslint-scoping stays a
    # separate, narrower check: it uses eslint's config-resolution API on a
    # handful of fixed paths and short in-memory snippets, not a lint pass over
    # the tree. It lives in this already-required job, not a new one, so the
    # check name the integration ruleset requires is unchanged.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run guards
      - run: npm run lint

  browser-security:
    runs-on: ubuntu-latest
    # Healthy runs finish in 3-8 minutes (npm ci ~25s, browser install
    # 20-200s, test:security ~5s, then the full tests/e2e directory:
    # auth-offline ~30s, draft-identity ~50s, draft-board ~2.5 min, all at
    # one worker - the 8-minute end is that install's slow case plus the
    # e2e suite, still comfortably under the 15-minute timeout below).
    # Twice the install step has sat in apt-get for hours when the runner's
    # Azure apt mirror stalled (runs 32166695949 and 32278921366), holding a
    # runner until GitHub's 6-hour default. Fail fast instead; a rerun gets
    # a fresh runner. The e2e directory alone reached 13.4 minutes once the
    # ADR 0067 wave 3 specs landed (run 38985472675 was cancelled at 15 with
    # 417 passing), so the cap is 25; the browser install keeps its own
    # 10-minute step timeout for the apt stall.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No --with-deps: that flag runs apt-get as root for Chromium's system
      # libraries, and the runner's apt mirror has stalled that step for hours
      # (runs 32166695949, 32278921366, 32294353227). ubuntu-latest already
      # ships Chromium and its libraries, so only the browser download is needed.
      - run: npx playwright install chromium
        timeout-minutes: 10
      - run: npm run test:security
        env:
          CI: "true"
          SECURITY_NETWORK_MODE: mock
      # No file argument: every spec under tests/e2e runs, not just the ones
      # named here by hand, so a spec added later is covered automatically
      # (issue #365) instead of being orphaned the way draft-board and
      # draft-identity were.
      - run: npm run test:e2e
        env:
          CI: "true"

  migration-smoke:
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: endzone_empire_test
      PGUSER: endzone
      PGPASSWORD: endzone_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Postgres 17 from the PGDG apt repo, not a service container: Docker Hub
      # and ECR Public both throttle anonymous image pulls on shared runners
      # (#2196, #2292), and PGDG keeps prod's major version. The runner image
      # preinstalls a stopped 16 cluster on 5432, so drop every cluster first
      # and create 17 on 5432 ourselves rather than let the package pick 5433.
      # Role, password and database come from the job env above.
      - name: Install and start PostgreSQL 17
        run: |
          set -euo pipefail
          cd /
          pg_lsclusters -h | while read -r v n _; do sudo pg_dropcluster --stop "$v" "$n"; done
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -q -y postgresql-17
          sudo pg_createcluster 17 main --port 5432 --start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v u="$PGUSER" -v pw="$PGPASSWORD" -v db="$PGDATABASE" <<'SQL'
          CREATE ROLE :"u" SUPERUSER LOGIN PASSWORD :'pw';
          CREATE DATABASE :"db" OWNER :"u";
          SQL
          pg_lsclusters
          psql -c 'select version()'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run migrate:rollback
      - run: npm run migrate
      # Every server/test/*.pg.test.js, run serially from one directory-wide
      # script (#371). scripts/run-pg-tests.js resolves the glob, runs the files
      # with --test-concurrency=1 (they share this one database), and keeps
      # holdout.pg.test.js last, which is defensive and not established: its
      # ledger rows are permanent for the rest of the job, so a future pg file
      # that asserted global ledger emptiness would break running after it,
      # though no such file exists today.
      # PG_TESTS=1 enables every file at once; each file also still honours its
      # own *_PG_TESTS variable for local runs. A new pg test file is picked up
      # here automatically, with no edit to this workflow -- what each file
      # proves, and why only a real Postgres can prove it, now lives in that
      # file's own head comment.
      - run: npm run test:pg
        env:
          PG_TESTS: "1"

  dependency-audit-root:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # A bare `npm audit` fails a required gate on an advisories-endpoint
      # outage exactly as it would on a real advisory (#838). This zero-
      # dependency wrapper (no npm ci needed) retries only the endpoint fault,
      # never a real advisory, and stays red with a named message when the
      # endpoint stays down. Its test runs in test-build (test:audit-with-retry).
      - run: node scripts/ci/audit-with-retry.js

  dependency-audit-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      # #757: Render builds the API with `npm ci --omit=dev --prefix server`
      # (render.yaml), which refuses a server lockfile that has drifted from
      # server/package.json. The root `npm ci` every other job runs never reads
      # that lock, so PR #751 shipped green while the server lock lacked a
      # dependency and the first prod build after merge failed in 15s. This
      # diffs the server lock against its manifest and exits non-zero naming any
      # missing package; --package-lock-only --depth=0 installs nothing.
      - run: npm ls --prefix server --package-lock-only --depth=0
      # Same wrapper as dependency-audit-root, scoped to server/ via the
      # prefix argument (#838). Its test runs in test-build.
      - run: node scripts/ci/audit-with-retry.js server
