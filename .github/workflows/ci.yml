name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the dev environment (Node 24 LTS). npm 11's lockfile
          # format/resolution is what package-lock.json is committed at;
          # older npm (Node 20 -> npm 10) rejects it under `npm ci`.
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail the build on any new hard-coded color literal (see
      # scripts/check-color-literals.js) so the design-token system stays intact.
      - run: npm run lint:colors
      - run: npm test
      - run: npm run test:server
      - run: npm run build
