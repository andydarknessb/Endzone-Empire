name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fail the build on any new hard-coded color literal (see
      # scripts/check-color-literals.js) so the design-token system stays intact.
      - run: npm run lint:colors
      - run: npm test
      - run: npm run test:server
      - run: npm run build
