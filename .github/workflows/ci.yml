name: CI

on:
  push:
    branches: [main, integration]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:colors
      # The holdout-confirm-2026 study captures against these constants; an
      # unintended change (even a key-order change) silently drops captured
      # weeks. Deliberate changes update the pin in the same commit.
      - run: node scripts/ci/check-model-constants.js
      - run: npm test -- --runInBand
        env:
          CI: "true"
      - run: npm run test:server
        env:
          # The Gate-3 publication (backtest-data/publish/) is committed as of
          # this workflow, so the clean-clone reconstruction test's
          # skip-if-absent mode is no longer the right default here - flip it
          # to a hard failure so a future accidental omission of the
          # publication tree cannot pass CI silently.
          BACKTEST_PUBLICATION_REQUIRED: "1"
      # Split out because six backtest sweep files are ~40 of the suite's 42
      # minutes; run-backtest-sweep alone is ~35. Same coverage, separate step,
      # so a failure points at which half broke.
      # Pushes to integration/main still run it; pull requests skip it so a PR
      # sees a ~10 minute test-build instead of ~50. Backtest changes on a PR
      # are covered by backtest-reproduction.yml, which triggers on those paths.
      - run: npm run test:server:sweep
        if: github.event_name != 'pull_request'
        env:
          # The Gate-3 publication (backtest-data/publish/) is committed as of
          # this workflow, so the clean-clone reconstruction test's
          # skip-if-absent mode is no longer the right default here - flip it
          # to a hard failure so a future accidental omission of the
          # publication tree cannot pass CI silently.
          BACKTEST_PUBLICATION_REQUIRED: "1"
      - run: npm run build
        env:
          CI: "true"
          GENERATE_SOURCEMAP: "false"
      - run: npm run check:bundle
      - run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-build-and-sbom
          path: |
            build
            sbom.cdx.json
          retention-days: 14

  browser-security:
    runs-on: ubuntu-latest
    # Healthy runs finish in 2-5 minutes (npm ci ~25s, browser install 20-200s,
    # test:security ~5s, auth-offline ~30s). Twice the install step has sat in
    # apt-get for hours when the runner's Azure apt mirror stalled (runs
    # 32166695949 and 32278921366), holding a runner until GitHub's 6-hour
    # default. Fail fast instead; a rerun gets a fresh runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No --with-deps: that flag runs apt-get as root for Chromium's system
      # libraries, and the runner's apt mirror has stalled that step for hours
      # (runs 32166695949, 32278921366, 32294353227). ubuntu-latest already
      # ships Chromium and its libraries, so only the browser download is needed.
      - run: npx playwright install chromium
        timeout-minutes: 10
      - run: npm run test:security
        env:
          CI: "true"
          SECURITY_NETWORK_MODE: mock
      - run: npm run test:e2e:auth-offline
        env:
          CI: "true"

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: endzone
          POSTGRES_PASSWORD: endzone_test
          POSTGRES_DB: endzone_empire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U endzone -d endzone_empire_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: endzone_empire_test
      PGUSER: endzone
      PGPASSWORD: endzone_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run migrate:rollback
      - run: npm run migrate
      # Snapshot-client CONTRACTS: the eight production queries re-implemented
      # in JS, checked against the real Postgres on identical seeded rows, plus
      # fn_normalize_nfl_team vs its JS twin, ORDER BY under the server
      # collation, ANY/LIMIT/LEFT-JOIN semantics, and reconstructed-mode
      # attribution against independent reference SQL. Seeds and deletes its
      # own far-future season, so it runs BEFORE the holdout tests below.
      - run: npm run test:backtest-pg
        env:
          BACKTEST_PG_TESTS: "1"

      # Holdout-ledger guarantees that only a real Postgres can prove:
      # append-only triggers, the child kickoff cutoff, transactional
      # atomicity, role/RLS compatibility, and the nonempty-rollback
      # refusal. Runs LAST: these tests insert ledger rows that by design
      # cannot be deleted, and the empty-ledger rollback smoke above must
      # keep passing.
      - run: npm run test:holdout-pg
        env:
          HOLDOUT_PG_TESTS: "1"

  dependency-audit-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm audit --omit=dev --audit-level=high

  dependency-audit-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm audit --prefix server --omit=dev --audit-level=high
