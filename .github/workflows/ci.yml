name: CI

on:
  push:
    branches: [main, integration]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:colors
      - run: npm test -- --runInBand
        env:
          CI: "true"
      - run: npm run test:server
      - run: npm run build
        env:
          CI: "true"
          GENERATE_SOURCEMAP: "false"
      - run: npm run check:bundle
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix server --omit=dev --audit-level=high
      - run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-build-and-sbom
          path: |
            build
            sbom.cdx.json
          retention-days: 14

  browser-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:security
        env:
          CI: "true"
          SECURITY_NETWORK_MODE: mock
      - run: npm run test:e2e:auth-offline
        env:
          CI: "true"

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: endzone
          POSTGRES_PASSWORD: endzone_test
          POSTGRES_DB: endzone_empire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U endzone -d endzone_empire_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: endzone_empire_test
      PGUSER: endzone
      PGPASSWORD: endzone_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run migrate:rollback
      - run: npm run migrate

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
