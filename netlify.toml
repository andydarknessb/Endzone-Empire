[build]
  command = "npm run build && npm run check:bundle"
  publish = "build"

[build.environment]
  CI = "true"
  NODE_VERSION = "24"
  # The repo is public, so published source maps expose nothing the source does
  # not already; Lighthouse's valid-source-maps audit fails without them.
  # scripts/check-bundle-budget.js only counts main.*.js, never the .map files.
  GENERATE_SOURCEMAP = "true"

[context.production.environment]
  REACT_APP_API_ORIGIN = "https://api.endzoneempire.gg"
  REACT_APP_SOCKET_ORIGIN = "https://api.endzoneempire.gg"
  REACT_APP_ENVIRONMENT = "production"

[[headers]]
  for = "/*"
  [headers.values]
    # Severs window.opener both ways: nothing in src/ reads or relies on it
    # (the only new-tab links carry rel="noopener noreferrer").
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https://api.endzoneempire.gg wss://api.endzoneempire.gg https://*.supabase.co wss://*.supabase.co; font-src 'self' data: https:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "https://endzoneempire.netlify.app/*"
  to = "https://endzoneempire.gg/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://api.endzoneempire.gg/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://api.endzoneempire.gg/api/public/sitemap.xml"
  status = 200
  force = true

# A missing hashed asset (an old tab asking for last deploy's chunk) is a 404,
# never the SPA page: the /* rewrite below would answer it 200 with index.html,
# and /static/* carries a year-long immutable cache, so the browser would keep
# that HTML under the script's URL until the cache was cleared. Unforced, so
# an asset that exists is served as always.
[[redirects]]
  from = "/static/*"
  to = "/404.html"
  status = 404

# A missing machine-readable file must be a real 404, never the SPA shell: agents
# and Lighthouse parse these as JSON, and the /* rewrite below would hand them
# index.html with a 200. Unforced, so a file that exists is served as always.
[[redirects]]
  from = "/.well-known/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/ai-catalog.json"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
