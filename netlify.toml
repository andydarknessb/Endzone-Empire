[build]
  command = "npm run build && npm run check:bundle"
  publish = "build"

[build.environment]
  CI = "true"
  NODE_VERSION = "24"
  GENERATE_SOURCEMAP = "false"

[context.production.environment]
  REACT_APP_API_ORIGIN = "https://api.endzoneempire.gg"
  REACT_APP_SOCKET_ORIGIN = "https://api.endzoneempire.gg"
  REACT_APP_ENVIRONMENT = "production"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https://api.endzoneempire.gg wss://api.endzoneempire.gg https://*.supabase.co wss://*.supabase.co; font-src 'self' data: https:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/api/*"
  to = "https://api.endzoneempire.gg/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://api.endzoneempire.gg/api/public/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
