[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"
  NODE_VERSION = "24"

[[redirects]]
  from = "/sitemap.xml"
  to = "https://api.endzoneempire.gg/api/public/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
